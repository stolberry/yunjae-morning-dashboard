<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>preview</title>
<style>
  html,body{margin:0;padding:0;background:#888}
  iframe{display:block;border:0;background:#fff}
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  var q = new URLSearchParams(location.search);
  var h = parseInt(q.get('h') || '924', 10);
  var w = parseInt(q.get('w') || '1480', 10);
  var f = document.createElement('iframe');
  f.id = 'frame';
  f.width = w;
  f.style.width = w + 'px';
  f.height = h;
  f.src = './index.html?t=' + Date.now();
  document.getElementById('wrap').appendChild(f);
</script>
</body>
</html>
