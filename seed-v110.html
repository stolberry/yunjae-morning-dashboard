<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>도감 확인용 임시 페이지 (v110)</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;font-size:16px;line-height:1.6}</style>
</head><body>
<h1>도감 확인용 임시 페이지 (v110)</h1>
<p id="msg">처리 중…</p>
<script>
(function () {
  var BAK = 'yj_seed_backup_v110';
  var KEYS = ['yj_balls_v1', 'yj_dex_v1', 'yj_stones_v1', 'yj_dex_costs_v1'];
  var mode = (new URLSearchParams(location.search)).get('mode') || 'seed';

  function read(k) { var v = localStorage.getItem(k); return v === null ? null : v; }
  function write(k, v) { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }

  if (mode === 'restore') {
    var raw = read(BAK);
    if (!raw) { document.getElementById('msg').textContent = '되돌릴 백업이 없습니다.'; return; }
    var bak = JSON.parse(raw);
    for (var i = 0; i < KEYS.length; i++) write(KEYS[i], bak[KEYS[i]] === undefined ? null : bak[KEYS[i]]);
    localStorage.removeItem(BAK);
    document.getElementById('msg').innerHTML = '원래 값으로 되돌렸습니다. <a href="./index.html">대시보드로</a>';
    return;
  }

  /* 백업은 처음 한 번만 (두 번 덮어써서 테스트 값이 백업되지 않도록) */
  if (!read(BAK)) {
    var bak = {};
    for (var j = 0; j < KEYS.length; j++) bak[KEYS[j]] = read(KEYS[j]);
    localStorage.setItem(BAK, JSON.stringify(bak));
  } else if (mode === 'seed-force') {
    var bak2 = {};
    for (var j2 = 0; j2 < KEYS.length; j2++) bak2[KEYS[j2]] = read(KEYS[j2]);
    localStorage.setItem(BAK, JSON.stringify(bak2));
  }

  var caught = [
    1, 2, 3, 4, 5, 6, 7, 25, 26, 39, 40, 54, 55, 94, 130, 133, 134, 135, 136,
    150, 151, 152, 153, 154, 155, 156, 157, 158, 159, 160, 175, 176, 197, 403, 404, 405, 468,
    700, 888, 906, 907, 908, 909, 910, 911, 912, 913, 914, 1007
  ];
  var dex = {};
  for (var k = 0; k < caught.length; k++) dex[String(caught[k])] = 1;

  localStorage.setItem('yj_balls_v1', JSON.stringify(120));
  localStorage.setItem('yj_stones_v1', JSON.stringify(4));
  localStorage.setItem('yj_dex_v1', JSON.stringify(dex));
  localStorage.removeItem('yj_dex_costs_v1');

  document.getElementById('msg').innerHTML = '확인용 기록을 넣었습니다. <a href="./index.html">대시보드로</a>';
  location.replace('./index.html');
})();
</script>
</body></html>
