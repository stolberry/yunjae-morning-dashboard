<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#2E2A25}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="frame" src="./index.html" title="윤재 루틴 미리보기"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w'), 10) || 1480;
  var h = parseInt(q.get('h'), 10) || 924;
  var f = document.getElementById('frame');
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
</script>
</body>
</html>
