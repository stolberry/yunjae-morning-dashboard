<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>v111 확인용 (검증 후 삭제)</title>
<style>
  html, body { margin: 0; background: #dcd7cb; font: 12px/1.5 -apple-system, sans-serif; }
  #bar { padding: 4px 8px; }
  #fr { display: block; width: 1480px; height: 924px; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="bar"></div>
<iframe id="fr" src="./index.html"></iframe>
<script>
  var KEYS = ['yj_dex_v1', 'yj_stones_v1', 'yj_dex_costs_v1'];
  var q = new URLSearchParams(location.search);
  var act = q.get('act') || '';
  var log = [];

  if (act === 'seed') {
    var backup = {};
    if (!localStorage.getItem('__v111_backup')) {
      KEYS.forEach(function (k) { backup[k] = localStorage.getItem(k); });
      localStorage.setItem('__v111_backup', JSON.stringify(backup));
      log.push('설비 백업 저장');
    }
    function rd(k) { try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) { return {}; } }
    var dex = rd('yj_dex_v1'), costs = rd('yj_dex_costs_v1');
    log.push('이전 dex: ' + JSON.stringify(dex));
    log.push('이전 stones: ' + localStorage.getItem('yj_stones_v1'));
    dex['656'] = 1; dex['657'] = 1; dex['658'] = 1; dex['10116'] = 1;
    costs['656'] = [10]; costs['657'] = [10]; costs['658'] = [10]; costs['10116'] = [50];
    localStorage.setItem('yj_dex_v1', JSON.stringify(dex));
    localStorage.setItem('yj_dex_costs_v1', JSON.stringify(costs));
    localStorage.setItem('yj_stones_v1', JSON.stringify(3));
    log.push('시드 완료: 656·657·658·10116 = 1마리씩, 진화의 돌 3개');
  }

  if (act === 'restore') {
    var b = {};
    try { b = JSON.parse(localStorage.getItem('__v111_backup') || '{}'); } catch (e) { b = {}; }
    KEYS.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(b, k) && b[k] !== null && b[k] !== undefined) {
        localStorage.setItem(k, b[k]);
      } else {
        localStorage.removeItem(k);
      }
      log.push(k + ' → ' + localStorage.getItem(k));
    });
    localStorage.removeItem('__v111_backup');
    log.push('원래 상태로 복원 후 백업 삭제');
  }

  if (act === 'status') {
    log.push('dex: ' + localStorage.getItem('yj_dex_v1'));
    log.push('stones: ' + localStorage.getItem('yj_stones_v1'));
    log.push('backup: ' + localStorage.getItem('__v111_backup'));
  }

  document.getElementById('bar').textContent = 'v111 확인용 · ' + (act || 'none') + ' · ' + log.join(' | ');
</script>
</body>
</html>
